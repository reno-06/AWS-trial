<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash It! - 2 Player Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-layer">
        <div class="player-hud" id="hud-p1">
            <h2 style="color: var(--p1-color); text-shadow: 0 0 10px var(--p1-color);">PLAYER 1</h2>
            <div class="health-bar-bg">
                <div class="health-bar-fill" id="health-fill-p1"></div>
            </div>
            <p class="controls-hint">Controls: A / D</p>
        </div>

        <div class="center-hud">
            <div class="score-display">
                <span id="score-text">0 - 0</span>
            </div>
            <div id="water-timer" class="water-timer">WATER RISING IN 20s</div>
        </div>

        <div class="player-hud" id="hud-p2" style="text-align: right;">
            <h2 style="color: var(--p2-color); text-shadow: 0 0 10px var(--p2-color);">PLAYER 2</h2>
            <div class="health-bar-bg">
                <div class="health-bar-fill" id="health-fill-p2"></div>
            </div>
            <p class="controls-hint">Controls: LEFT / RIGHT</p>
        </div>
    </div>

    <!-- Start / End Screens -->
    <div id="overlay" class="overlay-screen">
        <h1 id="main-title">CRASH IT!</h1>
        <p id="overlay-msg">A high-speed physics battle. Hit the other player's head!</p>
        <button id="start-btn">START GAME</button>
    </div>

    <!-- Custom Canvas for Background -->
    <canvas id="bgCanvas"></canvas>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
